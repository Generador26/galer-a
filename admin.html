<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#00778B"><link rel="icon" type="image/png" href="favicon.png">
<title>Panel – SEVEN Gigantografía</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3FAFB;--card:#fff;--mu:#E3F2F4;--fg:#0B2E36;--mf:#4F6B73;--bd:#C9E2E6;--ac:#00778B;--ac2:#005A6B;--rd:#B42318}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{font-family:'Source Sans 3',system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5}
h1,h2{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;letter-spacing:.03em}h2{font-size:1.8rem;margin-bottom:10px}
:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}button,a,label.b{cursor:pointer}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:16px}
.login .card{width:100%;max-width:380px}.login h1{font-size:2rem;text-align:center;margin:6px 0 10px}.lg{display:block;width:min(70%,240px);height:auto;margin:0 auto}
label{display:block;font-weight:600;font-size:.92rem;margin-top:10px}
input,textarea,select{width:100%;min-height:46px;padding:10px 12px;margin-top:4px;background:#fff;border:1px solid var(--bd);border-radius:10px;color:var(--fg);font:inherit}
input:focus,textarea:focus,select:focus{border-color:var(--ac);outline:2px solid var(--ac);outline-offset:0}
input[type=file]{padding:9px}input[type=checkbox]{width:20px;min-height:20px;margin:0 8px 0 0;vertical-align:middle}
.b{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;margin-top:12px;border-radius:10px;border:1px solid transparent;background:var(--ac);color:#fff;font:600 1rem 'Source Sans 3',sans-serif;text-decoration:none;transition:background .18s}
.b:hover{background:var(--ac2)}.b:disabled{opacity:.6;cursor:wait}.b.s{background:#fff;color:var(--fg);border-color:var(--bd);margin:0}.b.s:hover{background:var(--mu)}.b.r{background:#fff;color:var(--rd);border-color:var(--rd);margin:0}.b.r:hover{background:#FDECEA}
.top{background:#fff;border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top img{height:54px;width:auto}.top div{display:flex;gap:8px}
.wrap{max-width:900px;margin:auto;padding:18px 16px 60px}
.row{display:flex;gap:12px;align-items:center;border-top:1px solid var(--bd);padding:12px 0;flex-wrap:wrap}.row:first-of-type{border-top:0}
.row img{width:84px;height:62px;object-fit:cover;border-radius:8px;background:var(--mu)}
.t{flex:1;min-width:160px}.t b{display:block;overflow-wrap:anywhere}.t small{color:var(--mf)}
.st{display:inline-block;margin-left:6px;padding:1px 10px;border-radius:99px;font-size:.8rem;font-weight:700}.st.on{background:#D7F3E3;color:#0B5B2E}.st.off{background:#EEE;color:#444}
.ac{display:flex;gap:8px;flex-wrap:wrap}
#msg{min-height:24px;margin-top:10px;font-weight:600;color:var(--ac2)}#msg.e,#le{color:var(--rd)}#le{text-align:center;margin-top:8px}
.lb{position:fixed;inset:0;background:rgba(11,46,54,.7);display:none;align-items:center;justify-content:center;z-index:20;padding:14px;overflow:auto}.lb.on{display:flex}
.lb .card{width:100%;max-width:520px;margin:0}.fx{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.hint{color:var(--mf);font-size:.88rem}
</style></head><body>
<main class="login" id="lg"><div class="card"><img class="lg" src="logo.webp" width="800" height="432" alt="Gigantografía SEVEN"><h1>Panel de la galería</h1>
<label for="u">Usuario</label><input id="u" autocomplete="username">
<label for="p">Contraseña</label><input id="p" type="password" autocomplete="current-password">
<button class="b" id="go" style="width:100%">Entrar</button><p id="le" role="alert"></p></div></main>
<div id="ap" hidden>
<header class="top"><img src="logo.webp" width="800" height="432" alt="SEVEN"><div><a class="b s" href="index.html" target="_blank" rel="noopener">Ver web</a><button class="b s" id="out">Salir</button></div></header>
<main class="wrap">
<section class="card" aria-labelledby="h1s"><h2 id="h1s">Subir trabajo</h2>
<label for="ti">Título</label><input id="ti" placeholder="Ej: Letrero luminoso 3D" maxlength="120">
<label for="ca">Categoría</label><select id="ca"></select><input id="cn1" placeholder="Escribe la nueva categoría" maxlength="40" aria-label="Nueva categoría" hidden>
<label for="de">Descripción (opcional)</label><textarea id="de" rows="2"></textarea>
<label for="fi">Fotos (puedes elegir varias; se comprimen solas)</label><input id="fi" type="file" accept="image/*" multiple>
<button class="b" id="sub">Subir</button><p id="msg" role="status" aria-live="polite"></p></section>
<section class="card" aria-labelledby="h2s"><h2 id="h2s">Trabajos <small id="cn" class="hint"></small></h2><div id="ls"></div></section></main></div>
<div class="lb" id="ed" role="dialog" aria-modal="true" aria-labelledby="eh"><div class="card">
<h2 id="eh">Editar trabajo</h2>
<label for="et">Título</label><input id="et" maxlength="120">
<label for="ec">Categoría</label><select id="ec"></select><input id="cn2" placeholder="Escribe la nueva categoría" maxlength="40" aria-label="Nueva categoría" hidden>
<label for="edd">Descripción</label><textarea id="edd" rows="3"></textarea>
<label for="eo">Orden (el número menor aparece primero)</label><input id="eo" type="number" inputmode="numeric">
<label for="ef">Cambiar foto (opcional)</label><input id="ef" type="file" accept="image/*">
<label><input id="ev" type="checkbox">Visible en la web</label>
<p id="em" class="hint" role="status"></p>
<div class="fx"><button class="b" id="sv">Guardar cambios</button><button class="b s" id="ca2" style="margin-top:12px">Cancelar</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const URL_="https://nphlvrbbgnlexkzvzmwa.supabase.co",KEY="sb_publishable_GXblVl31H-lWmaOexwEb-w_uNXhdwGy";
const $=i=>document.getElementById(i);let sb=null,works=[],cur=null,last=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const client=t=>supabase.createClient(URL_,KEY,{global:{headers:{'x-client-info':'seven:'+t}},auth:{persistSession:false}});
const CATS=["Vinil","Gigantografías","Stickers","Backing Publicitario","Roll Screen","Corpóreos","Parante de metal","Toldos Publicitarios","Plumas Publicitarias","Banderolas","Cuadro Selfie","Etiquetas","Folder Corporativo","Fotocheck","Módulos publicitarios","Parante araña","Ruleta publicitaria","Señalética","Otros"];
let extra=[],pend='';
function opts(id,val){const l=[...CATS,...extra.filter(c=>!CATS.includes(c))];if(val&&!l.includes(val))l.push(val);
 $(id).innerHTML=(val?'':'<option value="">Elige una categoría…</option>')+'<option value="__nueva">+ Agregar otra categoría…</option>'+l.map(c=>`<option>${esc(c)}</option>`).join("");if(val)$(id).value=val}
function catVal(s,i){return $(s).value=='__nueva'?$(i).value.trim():$(s).value}
function tog(s,i){$(i).hidden=$(s).value!='__nueva';if(!$(i).hidden)$(i).focus()}
$('ca').onchange=()=>tog('ca','cn1');$('ec').onchange=()=>tog('ec','cn2');
opts('ca','');
const path=u=>u.split('/galeria/')[1];
async function start(t){sb=client(t);$('lg').hidden=true;$('ap').hidden=false;await load()}
$('go').onclick=async()=>{$('le').textContent="";
 const {data,error}=await client('').rpc('login_usuario',{p_usuario:$('u').value,p_password:$('p').value});
 const r=Array.isArray(data)?data[0]:data;
 if(error||!r||!r.ok){$('le').textContent=r?.msg||"No se pudo ingresar.";return}
 sessionStorage.setItem('gt',r.token);start(r.token)};
$('p').onkeydown=e=>{if(e.key=='Enter')$('go').click()};
$('out').onclick=()=>{sessionStorage.removeItem('gt');location.reload()};
const t0=sessionStorage.getItem('gt');if(t0)start(t0);
function toWebp(file,max,q){return new Promise((ok,ko)=>{const im=new Image();im.onload=()=>{
 const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
 c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
 c.toBlob(b=>b?ok(b):ko(new Error('No se pudo convertir la imagen')),'image/webp',q)};im.onerror=()=>ko(new Error('Imagen no válida'));im.src=URL.createObjectURL(file)})}
async function up(f){
 const id=crypto.randomUUID(),[big,sm]=await Promise.all([toWebp(f,1400,.8),toWebp(f,420,.75)]),o={contentType:'image/webp',cacheControl:'31536000'};
 let r=await sb.storage.from('galeria').upload(`g/${id}.webp`,big,o);if(r.error)throw r.error;
 r=await sb.storage.from('galeria').upload(`g/${id}_t.webp`,sm,o);if(r.error)throw r.error;
 const pu=p=>sb.storage.from('galeria').getPublicUrl(p).data.publicUrl;
 return{imagen_url:pu(`g/${id}.webp`),miniatura_url:pu(`g/${id}_t.webp`)}}
function say(t,e){$('msg').textContent=t;$('msg').className=e?'e':''}
$('sub').onclick=async()=>{
 const fs=[...$('fi').files],ti=$('ti').value.trim(),ca=catVal('ca','cn1');
 if(!fs.length||!ti||!ca){say("Falta el título, la categoría o la foto.",1);return}
 $('sub').disabled=true;
 try{for(const [i,f] of fs.entries()){say(`Subiendo ${i+1} de ${fs.length}…`);
  const u=await up(f),r=await sb.from('galeria_trabajos').insert({titulo:fs.length>1?`${ti} ${i+1}`:ti,categoria:ca,descripcion:$('de').value.trim()||null,...u});
  if(r.error)throw r.error}
  say("¡Subido!");pend=ca;$('cn1').hidden=true;$('cn1').value="";$('fi').value=$('ti').value=$('de').value=""}
 catch(e){say("Error: "+(e.message||e),1)}
 $('sub').disabled=false;load()};
async function load(){
 const a=await sb.from('galeria_trabajos').select('*').order('orden').order('created_at',{ascending:false});
 if(a.error){sessionStorage.removeItem('gt');alert('Tu sesión venció. Ingresa de nuevo.');location.reload();return}
 works=a.data;$('cn').textContent=`(${works.length})`;
 extra=works.map(x=>x.categoria);{const cv=pend||$('ca').value;pend='';opts('ca',cv&&cv!='__nueva'?cv:'');if(cv=='__nueva')$('ca').value=cv}
  $('ls').innerHTML=works.map(x=>`<div class="row"><img src="${esc(x.miniatura_url)}" alt=""><div class="t"><b>${esc(x.titulo)}</b><small>${esc(x.categoria)} · orden ${x.orden}</small><span class="st ${x.visible?'on':'off'}">${x.visible?'Visible':'Oculto'}</span></div>
 <div class="ac"><button class="b s" data-e="${x.id}">Editar</button><button class="b s" data-v="${x.id}">${x.visible?'Ocultar':'Mostrar'}</button><button class="b r" data-d="${x.id}">Borrar</button></div></div>`).join("")||'<p class="hint">Aún no hay trabajos. Sube el primero arriba.</p>'}
function openEd(x){last=document.activeElement;cur=x;$('et').value=x.titulo;opts('ec',x.categoria);$('cn2').hidden=true;$('cn2').value="";$('edd').value=x.descripcion||"";$('eo').value=x.orden;$('ev').checked=x.visible;$('ef').value="";$('em').textContent="";$('ed').classList.add('on');$('et').focus()}
function closeEd(){$('ed').classList.remove('on');last&&last.focus()}
$('ca2').onclick=closeEd;$('ed').onclick=e=>{if(e.target.id=='ed')closeEd()};
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&$('ed').classList.contains('on'))closeEd()});
$('sv').onclick=async()=>{
 const t=$('et').value.trim();if(!t){$('em').textContent="El título no puede estar vacío.";return}
 if(!catVal('ec','cn2')){$('em').textContent="Elige o escribe una categoría.";return}
 $('sv').disabled=true;$('em').textContent="Guardando…";
 try{const u={titulo:t,categoria:catVal('ec','cn2'),descripcion:$('edd').value.trim()||null,orden:parseInt($('eo').value)||0,visible:$('ev').checked},f=$('ef').files[0];
  if(f)Object.assign(u,await up(f));
  const r=await sb.from('galeria_trabajos').update(u).eq('id',cur.id);if(r.error)throw r.error;
  if(f)await sb.storage.from('galeria').remove([path(cur.imagen_url),path(cur.miniatura_url)]);
  closeEd();await load()}
 catch(e){$('em').textContent="Error: "+(e.message||e)}
 $('sv').disabled=false};
$('ls').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.e)openEd(works.find(w=>w.id==b.dataset.e));
 if(b.dataset.v){const x=works.find(w=>w.id==b.dataset.v);await sb.from('galeria_trabajos').update({visible:!x.visible}).eq('id',x.id);load()}
 if(b.dataset.d&&confirm('¿Borrar este trabajo y sus fotos? No se puede deshacer.')){
  const x=works.find(w=>w.id==b.dataset.d);
  await sb.storage.from('galeria').remove([path(x.imagen_url),path(x.miniatura_url)]);
  await sb.from('galeria_trabajos').delete().eq('id',x.id);load()}};
</script></body></html>
