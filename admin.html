<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin galería</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--tx:#f2f4f8;--mu:#9aa3b2;--ac:#ff5a1f;--bd:#262b36}
*{box-sizing:border-box;margin:0}body{font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx);padding:16px;max-width:900px;margin:auto}
h1,h2{margin:14px 0 8px}.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
input,textarea,select{width:100%;padding:10px;margin:5px 0;background:#0f1115;border:1px solid var(--bd);border-radius:8px;color:var(--tx);font:inherit}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font:inherit;margin:4px 4px 0 0}button.g{background:#333}button.r{background:#c0392b}
.row{display:flex;gap:10px;align-items:center;border-top:1px solid var(--bd);padding:8px 0}.row img{width:70px;height:52px;object-fit:cover;border-radius:6px}.row div{flex:1;min-width:0}
small{color:var(--mu)}#msg{color:#5fe08a;min-height:20px}.hide{display:none}a{color:#7ab8ff}
</style></head><body>
<div id="lg" class="c" style="max-width:360px;margin:60px auto"><h1>Ingresar</h1>
<input id="u" placeholder="Usuario"><input id="p" type="password" placeholder="Contraseña"><button id="go">Entrar</button><p id="le" style="color:#ff8a8a"></p></div>
<div id="ap" class="hide">
<h1>Galería <button class="g" id="out">Salir</button></h1>
<div class="c"><h2>Subir trabajo</h2>
<input id="ti" placeholder="Título (ej: Letrero luminoso 3D)" maxlength="120">
<input id="ca" placeholder="Categoría (ej: Letreros, Lonas, Vinilos)" list="cats" maxlength="40"><datalist id="cats"></datalist>
<textarea id="de" rows="2" placeholder="Descripción breve (opcional)"></textarea>
<input id="fi" type="file" accept="image/*" multiple>
<button id="sub">Subir (se comprime solo)</button><p id="msg"></p></div>
<div class="c"><h2>Trabajos</h2><div id="ls"></div></div>
<div class="c"><h2>Clientes interesados</h2><div id="lds"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const URL_="https://nphlvrbbgnlexkzvzmwa.supabase.co",KEY="sb_publishable_GXblVl31H-lWmaOexwEb-w_uNXhdwGy";
const $=i=>document.getElementById(i);let sb=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function client(tok){return supabase.createClient(URL_,KEY,{global:{headers:{'x-client-info':'seven:'+tok}},auth:{persistSession:false}})}
async function start(tok){sb=client(tok);$('lg').classList.add('hide');$('ap').classList.remove('hide');await load()}
$('go').onclick=async()=>{
 const {data,error}=await client('').rpc('login_usuario',{p_usuario:$('u').value,p_password:$('p').value});
 const r=Array.isArray(data)?data[0]:data;
 if(error||!r||!r.ok){$('le').textContent=r?.msg||"No se pudo ingresar.";return}
 sessionStorage.setItem('gt',r.token);start(r.token)};
$('out').onclick=()=>{sessionStorage.removeItem('gt');location.reload()};
const t0=sessionStorage.getItem('gt');if(t0)start(t0);
function toWebp(file,max,q){return new Promise((ok,ko)=>{const im=new Image();im.onload=()=>{
 const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
 c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
 c.toBlob(b=>b?ok(b):ko(new Error('webp')),'image/webp',q)};im.onerror=ko;im.src=URL.createObjectURL(file)})}
$('sub').onclick=async()=>{
 const fs=[...$('fi').files],ti=$('ti').value.trim(),ca=$('ca').value.trim()||'General';
 if(!fs.length||!ti){$('msg').textContent="Falta título o foto.";return}
 $('sub').disabled=true;
 try{for(const [i,f] of fs.entries()){
  $('msg').textContent=`Subiendo ${i+1}/${fs.length}…`;
  const id=crypto.randomUUID(),[big,sm]=await Promise.all([toWebp(f,1400,.8),toWebp(f,420,.75)]);
  const o={contentType:'image/webp',cacheControl:'31536000'};
  let r=await sb.storage.from('galeria').upload(`g/${id}.webp`,big,o);if(r.error)throw r.error;
  r=await sb.storage.from('galeria').upload(`g/${id}_t.webp`,sm,o);if(r.error)throw r.error;
  const pu=p=>sb.storage.from('galeria').getPublicUrl(p).data.publicUrl;
  r=await sb.from('galeria_trabajos').insert({titulo:fs.length>1?`${ti} ${i+1}`:ti,categoria:ca,descripcion:$('de').value.trim()||null,imagen_url:pu(`g/${id}.webp`),miniatura_url:pu(`g/${id}_t.webp`)});
  if(r.error)throw r.error}
  $('msg').textContent="¡Subido!";$('fi').value="";$('ti').value="";$('de').value=""}
 catch(e){$('msg').textContent="Error: "+(e.message||e)}
 $('sub').disabled=false;load()};
async function load(){
 const a=await sb.from('galeria_trabajos').select('*').order('created_at',{ascending:false});
 if(a.error){sessionStorage.removeItem('gt');alert('Sesión no válida');location.reload();return}
 $('cats').innerHTML=[...new Set(a.data.map(x=>x.categoria))].map(c=>`<option value="${esc(c)}">`).join("");
 $('ls').innerHTML=a.data.map(x=>`<div class="row"><img src="${esc(x.miniatura_url)}"><div><b>${esc(x.titulo)}</b><br><small>${esc(x.categoria)} · ${x.visible?'visible':'oculto'}</small></div>
 <button class="g" data-v="${x.id}" data-s="${x.visible}">${x.visible?'Ocultar':'Mostrar'}</button><button class="r" data-d="${x.id}">Borrar</button></div>`).join("")||"<small>Sin trabajos aún.</small>";
 const l=await sb.from('galeria_leads').select('*,galeria_trabajos(titulo)').order('created_at',{ascending:false}).limit(100);
 $('lds').innerHTML=(l.data||[]).map(x=>`<div class="row"><div><b>${esc(x.nombre)}</b> · <a href="https://wa.me/${esc(x.telefono.replace(/\D/g,''))}" target="_blank" rel="noopener">${esc(x.telefono)}</a><br><small>${esc(x.galeria_trabajos?.titulo||'—')} · ${new Date(x.created_at).toLocaleString()}</small><br>${esc(x.mensaje||'')}</div></div>`).join("")||"<small>Aún no hay clientes.</small>"}
$('ls').onclick=async e=>{const b=e.target;
 if(b.dataset.v){await sb.from('galeria_trabajos').update({visible:b.dataset.s!=='true'}).eq('id',b.dataset.v);load()}
 if(b.dataset.d&&confirm('¿Borrar este trabajo?')){
  const {data}=await sb.from('galeria_trabajos').select('imagen_url,miniatura_url').eq('id',b.dataset.d).single();
  const ps=[data?.imagen_url,data?.miniatura_url].filter(Boolean).map(u=>u.split('/galeria/')[1]);
  if(ps.length)await sb.storage.from('galeria').remove(ps);
  await sb.from('galeria_trabajos').delete().eq('id',b.dataset.d);load()}};
</script></body></html>
