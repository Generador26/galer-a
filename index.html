<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEVEN – Letreros y trabajos realizados</title>
<meta name="description" content="Galería de trabajos realizados por SEVEN. Mira los modelos y cotiza el que te guste por WhatsApp.">
<meta property="og:title" content="SEVEN – Galería de trabajos"><meta property="og:type" content="website">
<meta name="theme-color" content="#020617">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#020617;--card:#0E1223;--mu:#1A1E2F;--fg:#F8FAFC;--mf:#94A3B8;--bd:#334155;--ac:#EF4444;--wa:#25D366}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{font-family:'Source Sans 3',system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5}
h1,h2{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;letter-spacing:.03em}
:focus-visible{outline:3px solid #fff;outline-offset:3px}button,a{cursor:pointer}
.hero{padding:64px 20px 30px;text-align:center;max-width:860px;margin:auto}
.hero h1{font-size:clamp(4rem,18vw,8rem);line-height:.9}.hero h1 i{font-style:normal;color:var(--ac)}
.hero p{color:var(--mf);font-size:1.15rem;margin:14px auto 24px;max-width:540px}
.acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:10px;border:1px solid transparent;font:600 1rem 'Source Sans 3',sans-serif;text-decoration:none;transition:opacity .18s,background .18s}
.wa{background:var(--wa);color:#04210f}.wa:hover{opacity:.88}
.gh{background:var(--mu);color:var(--fg);border-color:var(--bd)}.gh:hover{background:var(--bd)}
svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#galeria{scroll-margin-top:12px;padding-top:28px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 16px 20px;max-width:1100px;margin:auto}
.chip{min-height:44px;padding:0 18px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:600 .95rem 'Source Sans 3',sans-serif;transition:background .18s}
.chip:hover{background:var(--mu)}.chip[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;padding:0 16px 56px;max-width:1200px;margin:auto}
.it{all:unset;box-sizing:border-box;cursor:pointer;display:block;background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;transition:border-color .18s}
.it:hover{border-color:var(--ac)}.it:focus-visible{outline:3px solid #fff;outline-offset:3px}
.it img{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--mu)}
.it span{display:block;padding:12px 14px}.it b{display:block;overflow-wrap:anywhere}.it small{color:var(--mf)}
.sk{aspect-ratio:4/3.6;border-radius:12px;background:var(--mu);animation:p 1.4s infinite}@keyframes p{50%{opacity:.5}}
.msg{grid-column:1/-1;text-align:center;color:var(--mf);padding:40px 0}
.lb{position:fixed;inset:0;background:rgba(2,6,23,.95);display:none;z-index:20;overflow:auto;padding:14px}
.lb.on{display:flex;align-items:center;justify-content:center}
.bx{background:var(--card);border:1px solid var(--bd);border-radius:14px;max-width:820px;width:100%;overflow:hidden}
.im{position:relative;background:#000}.im img{width:100%;max-height:62vh;object-fit:contain;display:block}
.rb{position:absolute;width:48px;height:48px;border-radius:50%;border:1px solid var(--bd);background:rgba(2,6,23,.8);color:var(--fg);display:flex;align-items:center;justify-content:center}
.rb:hover{background:var(--ac);color:#000}.x{top:10px;right:10px}.pv{left:10px;top:50%;margin-top:-24px}.nx{right:10px;top:50%;margin-top:-24px}
.bd{padding:16px 18px 20px}.bd h2{font-size:2.1rem;line-height:1.05;overflow-wrap:anywhere}.bd p{color:var(--mf);margin:6px 0 16px}
.fab{position:fixed;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:var(--wa);color:#04210f;display:flex;align-items:center;justify-content:center;z-index:10;transition:opacity .18s}.fab:hover{opacity:.88}.fab svg{width:28px;height:28px}
footer{text-align:center;color:var(--mf);padding:8px 16px 90px;font-size:.95rem}footer a{color:var(--fg)}
</style></head><body>
<header class="hero"><h1>SEV<i>E</i>N</h1>
<p>Mira los trabajos que hemos realizado y cotiza el modelo que te guste directo por WhatsApp.</p>
<div class="acts"><a class="btn wa" id="hw" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>Cotizar por WhatsApp</a><a class="btn gh" href="#galeria">Ver trabajos</a></div></header>
<section id="galeria" aria-label="Galería de trabajos">
<div class="chips" id="chips" role="group" aria-label="Filtrar por categoría"></div>
<main class="grid" id="grid" aria-live="polite"><div class="sk"></div><div class="sk"></div><div class="sk"></div></main></section>
<footer>© <span id="yr"></span> SEVEN · WhatsApp <a id="fw" target="_blank" rel="noopener">+591 76913792</a></footer>
<a class="fab" id="fab" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></a>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="bx">
<div class="im"><img id="mi" alt="">
<button class="rb x" id="cl" aria-label="Cerrar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
<button class="rb pv" id="pv" aria-label="Anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
<button class="rb nx" id="nx" aria-label="Siguiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></div>
<div class="bd"><h2 id="mt"></h2><p id="md"></p>
<a class="btn wa" id="wa" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>Cotizar este modelo por WhatsApp</a></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const CFG={nombre:"SEVEN",whatsapp:"59176913792",
url:"https://nphlvrbbgnlexkzvzmwa.supabase.co",key:"sb_publishable_GXblVl31H-lWmaOexwEb-w_uNXhdwGy"};
const $=i=>document.getElementById(i),sb=supabase.createClient(CFG.url,CFG.key);
const wa=t=>`https://wa.me/${CFG.whatsapp}?text=`+encodeURIComponent(t);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
$('yr').textContent=new Date().getFullYear();
$('hw').href=$('fab').href=$('fw').href=wa("Hola, quiero cotizar un trabajo");
let all=[],cat="Todos",view=[],idx=0,last=null;
function draw(){
 const cs=["Todos",...new Set(all.map(x=>x.categoria))];
 $('chips').innerHTML=cs.length>2?cs.map(c=>`<button class="chip" aria-pressed="${c==cat}" data-c="${esc(c)}">${esc(c)}</button>`).join(""):"";
 view=all.filter(x=>cat=="Todos"||x.categoria==cat);
 $('grid').innerHTML=view.map((x,i)=>`<button class="it" data-i="${i}" aria-label="Ver ${esc(x.titulo)}"><img loading="lazy" decoding="async" src="${esc(x.miniatura_url||x.imagen_url)}" alt="${esc(x.titulo)}"><span><b>${esc(x.titulo)}</b><small>${esc(x.categoria)}</small></span></button>`).join("")||'<p class="msg">Pronto subiremos nuevos trabajos.</p>';
}
function show(i){
 idx=(i+view.length)%view.length;const x=view[idx];
 $('mi').src=x.imagen_url;$('mi').alt=x.titulo;$('mt').textContent=x.titulo;$('md').textContent=x.descripcion||x.categoria;$('md').hidden=false;
 $('wa').href=wa("Hola, quiero cotizar este trabajo: "+x.titulo);
 $('pv').hidden=$('nx').hidden=view.length<2}
function open_(i){last=document.activeElement;show(i);$('lb').classList.add('on');document.body.style.overflow='hidden';$('cl').focus()}
function close_(){$('lb').classList.remove('on');document.body.style.overflow='';last&&last.focus()}
$('chips').onclick=e=>{const c=e.target.closest('.chip');if(c){cat=c.dataset.c;draw()}};
$('grid').onclick=e=>{const it=e.target.closest('.it');if(it)open_(+it.dataset.i)};
$('cl').onclick=close_;$('pv').onclick=()=>show(idx-1);$('nx').onclick=()=>show(idx+1);
$('lb').onclick=e=>{if(e.target.id=='lb')close_()};
document.addEventListener('keydown',e=>{
 if(!$('lb').classList.contains('on'))return;
 if(e.key=='Escape')close_();
 else if(e.key=='ArrowLeft'&&view.length>1)show(idx-1);
 else if(e.key=='ArrowRight'&&view.length>1)show(idx+1);
 else if(e.key=='Tab'){const f=[...$('lb').querySelectorAll('button:not([hidden]),a[href]')];
  if(e.shiftKey&&document.activeElement==f[0]){e.preventDefault();f[f.length-1].focus()}
  else if(!e.shiftKey&&document.activeElement==f[f.length-1]){e.preventDefault();f[0].focus()}}});
sb.from('galeria_trabajos').select('*').eq('visible',true).order('orden').order('created_at',{ascending:false})
 .then(({data,error})=>{if(error){$('grid').innerHTML='<p class="msg">No pudimos cargar los trabajos. Escríbenos por WhatsApp.</p>';return}all=data||[];draw()});
</script></body></html>
