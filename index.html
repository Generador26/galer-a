<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEVEN – Galería de trabajos</title>
<meta name="description" content="Letreros, rótulos y trabajos realizados. Cotiza el modelo que te guste.">
<style>
:root{--bg:#0f1115;--card:#181b22;--tx:#f2f4f8;--mu:#9aa3b2;--ac:#ff5a1f;--bd:#262b36}
*{box-sizing:border-box;margin:0}body{font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:28px 16px 12px;text-align:center}h1{font-size:clamp(1.5rem,5vw,2.4rem)}header p{color:var(--mu);margin-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:12px 16px}
.chip{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:99px;padding:8px 16px;cursor:pointer;font-size:.9rem}
.chip.on{background:var(--ac);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:12px 16px 40px;max-width:1200px;margin:auto}
.it{background:var(--card);border-radius:12px;overflow:hidden;cursor:pointer;border:1px solid var(--bd);transition:transform .2s}
.it:hover{transform:translateY(-4px)}.it img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#222}
.it div{padding:10px 12px}.it small{color:var(--mu)}
.modal{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:14px;z-index:9;overflow:auto}
.modal.on{display:flex}.box{background:var(--card);border-radius:14px;max-width:760px;width:100%;overflow:hidden}
.box img{width:100%;max-height:55vh;object-fit:contain;background:#000;display:block}.box .b{padding:16px}
input,textarea{width:100%;padding:11px;margin:6px 0;background:#0f1115;border:1px solid var(--bd);border-radius:8px;color:var(--tx);font:inherit}
.btn{display:inline-block;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:11px 18px;cursor:pointer;text-decoration:none;font:inherit;margin:6px 6px 0 0}
.btn.w{background:#25d366}.btn.g{background:#333}#ok{color:#5fe08a;margin-top:8px}
footer{text-align:center;color:var(--mu);padding:20px;font-size:.85rem}
</style></head><body>
<header><h1 id="nom"></h1><p>Mira nuestros trabajos y cotiza el modelo que te guste</p></header>
<div class="chips" id="chips"></div>
<main class="grid" id="grid"></main>
<div class="modal" id="m"><div class="box">
<img id="mi" alt=""><div class="b"><h2 id="mt"></h2><p id="md" style="color:var(--mu);margin:6px 0 10px"></p>
<div id="f"><input id="n" placeholder="Tu nombre" maxlength="80"><input id="t" placeholder="Tu celular / WhatsApp" maxlength="20" inputmode="tel">
<textarea id="ms" rows="2" placeholder="Cuéntanos qué necesitas (medidas, ubicación…)" maxlength="500"></textarea>
<button class="btn" id="env">Quiero una cotización</button><a class="btn w" id="wa" target="_blank" rel="noopener">WhatsApp</a><button class="btn g" id="cl">Cerrar</button></div>
<p id="ok"></p></div></div></div>
<footer id="ft"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const CFG={nombre:"SEVEN",whatsapp:"591XXXXXXXX",
url:"https://nphlvrbbgnlexkzvzmwa.supabase.co",key:"sb_publishable_GXblVl31H-lWmaOexwEb-w_uNXhdwGy"};
const $=i=>document.getElementById(i),sb=supabase.createClient(CFG.url,CFG.key);
$('nom').textContent=CFG.nombre;$('ft').textContent="© "+new Date().getFullYear()+" "+CFG.nombre;
let all=[],cat="Todos",cur=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function draw(){
 const cs=["Todos",...new Set(all.map(x=>x.categoria))];
 $('chips').innerHTML=cs.map(c=>`<button class="chip ${c==cat?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
 $('grid').innerHTML=all.filter(x=>cat=="Todos"||x.categoria==cat).map(x=>
  `<div class="it" data-i="${x.id}"><img loading="lazy" src="${esc(x.miniatura_url||x.imagen_url)}" alt="${esc(x.titulo)}"><div><b>${esc(x.titulo)}</b><br><small>${esc(x.categoria)}</small></div></div>`).join("")||'<p style="grid-column:1/-1;text-align:center;color:var(--mu)">Pronto subiremos nuevos trabajos.</p>';
}
$('chips').onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;draw()}};
$('grid').onclick=e=>{const it=e.target.closest('.it');if(!it)return;cur=all.find(x=>x.id==it.dataset.i);
 $('mi').src=cur.imagen_url;$('mt').textContent=cur.titulo;$('md').textContent=cur.descripcion||"";$('ok').textContent="";$('f').style.display="block";
 $('wa').href=`https://wa.me/${CFG.whatsapp}?text=`+encodeURIComponent(`Hola, me interesa este trabajo: ${cur.titulo}`);$('m').classList.add('on')};
$('cl').onclick=()=>$('m').classList.remove('on');$('m').onclick=e=>{if(e.target.id=='m')$('m').classList.remove('on')};
$('env').onclick=async()=>{
 const n=$('n').value.trim(),t=$('t').value.trim();
 if(n.length<2||t.length<6){$('ok').style.color="#ff8a8a";$('ok').textContent="Escribe tu nombre y un celular válido.";return}
 $('env').disabled=true;
 const {error}=await sb.from('galeria_leads').insert({nombre:n,telefono:t,mensaje:$('ms').value.trim()||null,trabajo_id:cur?.id||null});
 $('env').disabled=false;$('ok').style.color=error?"#ff8a8a":"#5fe08a";
 $('ok').textContent=error?"No se pudo enviar. Escríbenos por WhatsApp.":"¡Listo! Te contactaremos pronto.";
 if(!error){$('f').style.display="none";$('n').value=$('t').value=$('ms').value=""}};
sb.from('galeria_trabajos').select('*').eq('visible',true).order('orden').order('created_at',{ascending:false})
 .then(({data})=>{all=data||[];draw()});
</script></body></html>
